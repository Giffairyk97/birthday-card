<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HBD Special Gift</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --gold: #d4af37; --dark: #0b101b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--dark); color: white; font-family: sans-serif; overflow-x: hidden; }

        /* Full Screen Sections */
        section { height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border-bottom: 1px solid rgba(212,175,55,0.2); }

        /* 1. Photo Slider */
        .swiper { width: 100%; height: 60vh; border-radius: 15px; border: 2px solid var(--gold); }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        .hint-text { margin-top: 15px; font-size: 0.9rem; color: var(--gold); animation: bounce 2s infinite; }

        /* 2. Interactive Card */
        .card-container { perspective: 1000px; width: 300px; height: 200px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.8s; transform-style: preserve-3d; }
        .card-container.open .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--gold); font-size: 1.2rem; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-front { background: #1a1f2c; color: var(--gold); }
        .card-back { background: var(--gold); color: var(--dark); transform: rotateY(180deg); padding: 20px; font-weight: bold; }

        /* 3. Cake & Candles */
        .cake-area { position: relative; width: 200px; height: 150px; background: #5d4037; border-radius: 20px 20px 0 0; margin-top: 50px; border-top: 8px solid #f8bbd0; }
        .candle { width: 10px; height: 40px; background: #ff5252; position: absolute; top: -40px; display: none; border-radius: 5px; }
        .flame { width: 10px; height: 15px; background: orange; border-radius: 50%; position: absolute; top: -12px; box-shadow: 0 0 10px orange; animation: flicker 0.1s infinite alternate; }
        .btn-candle { background: var(--gold); color: var(--dark); border: none; padding: 10px 20px; border-radius: 20px; margin-bottom: 20px; font-weight: bold; }

        @keyframes bounce { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
        @keyframes flicker { from { opacity: 0.8; } to { opacity: 1; } }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="WWJ - คำอวยพร (Happy Birthday) [Official Audio].mp3" type="audio/mpeg">
    </audio>

    <section>
        <h2 style="color: var(--gold);">Our Memories</h2>
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="1774201822316.jpg"></div>
                <div class="swiper-slide"><img src="photo2.jpg"></div>
                <div class="swiper-slide"><img src="photo3.jpg"></div>
            </div>
        </div>
        <p class="hint-text">เลื่อนดูรูปภาพ >> </p>
    </section>

    <section>
        <h2 style="color: var(--gold);">Special Message</h2>
        <div class="card-container" onclick="this.classList.toggle('open'); startMusic()">
            <div class="card-inner">
                <div class="card-front">แตะเพื่อเปิดการ์ด ✨</div>
                <div class="card-back">สุขสันต์วันเกิดคุณโซ่ ขอให้มีความสุขที่สุดในโลก!<br>ถอดสมองเยอะๆ นะครับ 555 ❤️เซบ</div>
            </div>
        </div>
    </section>

    <section>
        <button class="btn-candle" onclick="addCandle()">ปักเทียนวันเกิด 🎂</button>
        <div class="cake-area">
            <div id="candle1" class="candle" style="left: 45px;"><div class="flame"></div></div>
            <div id="candle2" class="candle" style="left: 95px;"><div class="flame"></div></div>
            <div id="candle3" class="candle" style="left: 145px;"><div class="flame"></div></div>
        </div>
        <p style="margin-top: 20px; opacity: 0.7;">เลื่อนลงเพื่อดูหน้าต่อไป</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        // 1. ตั้งค่า Slide
        const swiper = new Swiper(".mySwiper", { spaceBetween: 30, loop: true });

        // 2. ฟังก์ชันเริ่มเพลง (ต้องมีการแตะหน้าจอก่อน)
        function startMusic() {
            document.getElementById('bgMusic').play();
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        // 3. ฟังก์ชันปักเทียน
        let candleCount = 0;
        function addCandle() {
            candleCount++;
            if(candleCount <= 3) {
                document.getElementById('candle' + candleCount).style.display = 'block';
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
            }
            if(candleCount === 3) {
                alert("สุขสันต์วันเกิด! เป่าเทียนได้เลย! 🕯️✨");
            }
        }
    </script>
</body>
</html>
