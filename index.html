<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD Special Card</title>
    <style>
        body { 
            margin: 0; 
            background: #0b0d17; 
            color: #d4af37; 
            font-family: 'serif'; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        .card { 
            text-align: center; 
            padding: 40px; 
            border: 1px solid #d4af37; 
            border-radius: 15px; 
            background: rgba(255,255,255,0.02); 
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2rem; letter-spacing: 2px; }
        p { color: white; opacity: 0.8; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Happy Birthday, my dear friend ᯓ Σ𝙉𝙕𝙊‡ ✈︎</h1>
        <p>ขอให้ปีนี้เป็นปีที่เต็มไปด้วยความสุข<br>และเรื่องราวที่สวยงามนะครับ</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        window.onload = () => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#d4af37', '#ffffff'] });
        };
    </script>
</body>
</html>
